name: E2E Tests & Report Generation

on:
  push:
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Frontend/**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./Frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        working-directory: ./Frontend
        run: pnpm run build

      - name: Run Unit Tests
        working-directory: ./Frontend
        run: pnpm run test:unit
        continue-on-error: true

      - name: Run Selenium E2E Tests
        working-directory: ./Frontend
        run: pnpm run test:selenium:ci
        continue-on-error: true

      - name: Run Security Vulnerability Tests
        working-directory: ./Frontend
        run: pnpm run test:security
        continue-on-error: true

      - name: Generate Test Report
        working-directory: ./Frontend
        run: pnpm run test:report
        continue-on-error: true

      - name: Upload Security Vulnerability Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-vulnerability-report
          path: |
            Frontend/test cases/see secrity test.xlsx
            Frontend/tests/report/vulnerability-test-results.xlsx
          retention-days: 30

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-report
          path: |
            Frontend/tests/report/selenium-test-results.xlsx
            Frontend/test cases/see secrity test_Selenium.xlsx
          retention-days: 30

      - name: Upload Appium Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-report
          path: app/appium-e2e-results.xlsx
          retention-days: 30

      - name: Upload Load Test Baseline Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-load-test-results
          path: Frontend/tests/report/api-load-test-results.xlsx
          retention-days: 30

      - name: Upload Combined Test Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-test-analysis-report
          path: Frontend/tests/report/test-analysis.xlsx
          retention-days: 30

      - name: Upload Test Results (JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-json
          path: Frontend/tests/report/
          retention-days: 30

      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 📊 E2E Test Results\n\n';
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'Frontend/tests/report/');
            if (fs.existsSync(reportPath)) {
              comment += '✅ Reports generated successfully!\n\n';
              comment += '### 📁 Download Artifacts\n';
              comment += '- **Security Vulnerability Report** (Excel file containing 250+ security compliance check results)\n';
              comment += '- **Selenium Test Report** (Excel file with detailed results)\n';
              comment += '- **Appium Test Report** (Mobile App results)\n';
              comment += '- **Load Test Baseline Report** (API load test results)\n';
              comment += '- **Test Results** (JSON format for analysis)\n';
              comment += '\nArtifacts are available in the Actions run page.\n';
            } else {
              comment += '⚠️ Test reports not found\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
